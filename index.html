<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goose Grab</title>
    <meta
      name="description"
      content="A tiny stacked-tile matching game: clear the pot before the rack overflows or the clock runs out."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Goose Grab</h1>
      <div class="hud">
        <span class="timer" id="timer" aria-live="polite">1:30</span>
        <button class="restart" id="restart" type="button">New game</button>
      </div>
      <div class="board" id="board" aria-label="Pot of tiles"></div>
      <div class="rack" id="rack" aria-label="Collected tiles"></div>
      <p class="banner" id="banner" aria-live="polite" hidden></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
